name: Go test

on: [push]

permissions:
  contents: read
  pull-requests: read

jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Go generate
        run: |
          go generate ./...
          touch cmd/rest-server/static/placeholder # we're not building frontend, so we put a placeholder
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          only-new-issues: true
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go (toolchain from go.mod)
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Go generate
        run: |
          go generate ./...
          touch cmd/rest-server/static/placeholder # we're not building frontend, so we put a placeholder
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: Check for disallowed packages
        run: |
          if go list -deps ./... | grep 'golang.org/x/crypto/openpgp'; then
            echo "golang.org/x/crypto/openpgp is unmaintained and must not be used (GO-2026-5932)"
            exit 1
          fi
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go 1.26.x
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: Install dependencies
        run: |
          go get ./...
      - name: Go generate
        run: |
          go generate ./...
          touch cmd/rest-server/static/placeholder # we're not building frontend, so we put a placeholder
      - name: Test
        run: make test
      - name: Build release binaries
        run: make build-amd64 build-arm64
